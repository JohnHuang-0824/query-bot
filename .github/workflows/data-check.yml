# 每週檢查倉庫裡的 data/ 有沒有落後到讓新卡查不到。失敗時 GitHub 會寄通知。
#
# 卡表在 bot 啟動時自己下載，data/ 要手動從上游同步；忘了同步的話新卡整張
# 查不到，而且沒有任何錯誤（實際發生過，落後兩個多月、161 張）。
#
# ⚠️ 這只抓得到「查不到的卡」。禁限卡表更新不會讓它變紅。
# ⚠️ fork 的排程 workflow 可能要到 Actions 分頁另外啟用；公開倉庫超過 60 天
#    沒有任何活動時，GitHub 也會自動停掉排程。
name: data 過期檢查

on:
  schedule:
    - cron: '17 1 * * 1' # 每週一 01:17 UTC = 台灣 09:17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 版本釘 commit，標籤是可以被移動的
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # 跟 Dockerfile 一致

      # 檢查腳本只用 Node 內建模組，不用安裝套件
      - run: node scripts/check-data.mjs
